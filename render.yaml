services:
  - type: web
    name: corpo-sport-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Corpo Sport Event"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
